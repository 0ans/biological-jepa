<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Biological JEPA research architecture</title><desc id="desc">Observed patient visits flow through a history encoder, latent time-conditioned predictor, and clinical head. A separate exponential-moving-average target encoder receives future observations only during training. Supervised loss, latent loss, and optional biological constraints train the model.</desc>
<defs><style>.bg{fill:#0b1120}.panel{fill:#142238;stroke:#334762;stroke-width:2}.cyan{fill:#163c4c;stroke:#38bdf8;stroke-width:2}.green{fill:#11392f;stroke:#34d399;stroke-width:2}.amber{fill:#4c3619;stroke:#f59e0b;stroke-width:2}.purple{fill:#30234d;stroke:#a78bfa;stroke-width:2}.txt{fill:#eff6ff;font:600 23px system-ui,sans-serif}.small{fill:#bac9dd;font:16px system-ui,sans-serif}.head{fill:#f8fafc;font:700 38px system-ui,sans-serif}.arrow{stroke:#9fb4d0;stroke-width:3;fill:none;marker-end:url(#tip)}.dash{stroke:#a78bfa;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#tip)}</style><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9fb4d0"/></marker></defs>
<rect class="bg" width="1400" height="720"/><text class="head" x="64" y="76">BIOLOGICAL JEPA <tspan fill="#38bdf8">/ research architecture</tspan></text><text class="small" x="65" y="109">Temporal latent prediction with supervised clinical forecasting · conceptual schematic, not clinical validation</text>
<rect class="panel" x="50" y="176" width="250" height="134" rx="16"/><text class="txt" x="72" y="219">Patient history</text><text class="small" x="72" y="250">Visits · masks · context</text><text class="small" x="72" y="276">Observed up to time t</text>
<rect class="cyan" x="380" y="176" width="230" height="134" rx="16"/><text class="txt" x="407" y="217">History encoder</text><text class="small" x="407" y="251">GRU + projection</text><text class="small" x="407" y="278">latent state z(t)</text>
<rect class="cyan" x="707" y="176" width="249" height="134" rx="16"/><text class="txt" x="733" y="217">Future predictor</text><text class="small" x="733" y="251">P(z(t), Fourier Δt)</text><text class="small" x="733" y="278">predicted latent ẑ</text>
<rect class="green" x="1060" y="176" width="282" height="134" rx="16"/><text class="txt" x="1085" y="219">Clinical head</text><text class="small" x="1085" y="250">MMSE · ADAS13 · CDR-SB</text><text class="small" x="1085" y="278">Supervised outcomes</text>
<path class="arrow" d="M300 243H380"/><path class="arrow" d="M610 243H707"/><path class="arrow" d="M956 243H1060"/>
<rect class="purple" x="374" y="432" width="305" height="128" rx="16"/><text class="txt" x="397" y="470">EMA target encoder</text><text class="small" x="397" y="501">Future history (training only)</text><text class="small" x="397" y="529">Stop-gradient target embedding</text>
<rect class="panel" x="48" y="432" width="236" height="128" rx="16"/><text class="txt" x="69" y="472">Observed future</text><text class="small" x="69" y="504">Target visit t + Δt</text><text class="small" x="69" y="532">Training only</text>
<rect class="amber" x="797" y="425" width="544" height="142" rx="16"/><text class="txt" x="824" y="466">Training objectives</text><text class="small" x="824" y="498">Latent SmoothL1 · clinical masked MSE</text><text class="small" x="824" y="529">Variance / covariance · optional biological penalties</text>
<path class="arrow" d="M284 496H374"/><path class="dash" d="M679 496H797"/><path class="dash" d="M831 310V425"/><path class="dash" d="M1190 310V425"/>
<text class="small" x="59" y="649">At inference: only the top path is used. The lower target branch and loss computation are training-only.</text><text class="small" x="59" y="680">Source: implementation in src/biojepa/model/jepa.py · Diagram version 2026-10</text></svg>