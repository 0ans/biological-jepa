<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Biological JEPA validation and audit workflow</title><desc id="desc">Diagram showing patient level split then training transformations, matched horizon-conditioned baselines, isolated ablations, subject-level metric estimation and external validation.</desc>
<defs><style>.base{fill:#0c1423}.head{fill:#f8fafc;font:700 36px system-ui}.label{fill:#f8fafc;font:600 21px system-ui}.sub{fill:#b4c5d8;font:16px system-ui}.n{fill:#67e8f9;font:700 17px system-ui}.box{fill:#18283e;stroke:#465971;stroke-width:2}.rule{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path fill="#67e8f9" d="M0 0L10 5L0 10Z"/></marker></defs>
<rect class="base" width="1400" height="650"/><text class="head" x="66" y="80">Validation protocol <tspan fill="#67e8f9">/ from cohorts to evidence</tspan></text><text class="sub" x="66" y="114">Audit trail — not a claim that validation has been completed</text>
<rect class="box" x="65" y="178" width="290" height="152" rx="18"/><text class="n" x="89" y="215">01 · DESIGN</text><text class="label" x="89" y="251">Split by patient</text><text class="sub" x="89" y="281">No patient shared between</text><text class="sub" x="89" y="305">train / validation / test</text>
<rect class="box" x="433" y="178" width="290" height="152" rx="18"/><text class="n" x="457" y="215">02 · PREPROCESS</text><text class="label" x="457" y="251">Fit on train only</text><text class="sub" x="457" y="281">Masks, normalization,</text><text class="sub" x="457" y="305">temporal index checks</text>
<rect class="box" x="801" y="178" width="290" height="152" rx="18"/><text class="n" x="825" y="215">03 · COMPARE</text><text class="label" x="825" y="251">Fair forecast horizon</text><text class="sub" x="825" y="281">JEPA, GRU, Ridge, HGB</text><text class="sub" x="825" y="305">identical temporal query</text>
<path class="rule" d="M355 254H433"/><path class="rule" d="M723 254H801"/>
<path class="rule" d="M1091 254H1260V382H243V419"/>
<rect class="box" x="65" y="419" width="390" height="158" rx="18"/><text class="n" x="91" y="456">04 · ABLATE</text><text class="label" x="91" y="492">Isolate the JEPA loss</text><text class="sub" x="91" y="523">Identical model: latent weight 0 vs 1</text><text class="sub" x="91" y="549">Separately ablate biological rules</text>
<rect class="box" x="527" y="419" width="390" height="158" rx="18"/><text class="n" x="553" y="456">05 · QUANTIFY</text><text class="label" x="553" y="492">Patient-level uncertainty</text><text class="sub" x="553" y="523">MAE by horizon · clustered 95% CI</text><text class="sub" x="553" y="549">Pre-registered primary endpoint</text>
<rect class="box" x="989" y="419" width="346" height="158" rx="18"/><text class="n" x="1015" y="456">06 · VALIDATE</text><text class="label" x="1015" y="492">Independent cohort</text><text class="sub" x="1015" y="523">Distribution shift, censoring,</text><text class="sub" x="1015" y="549">subgroups, uncertainty</text>
<path class="rule" d="M455 498H527"/><path class="rule" d="M917 498H989"/>
<text class="sub" x="66" y="625">Only report verified comparisons and uncertainty after all runs finish. Archived benchmarks are not a current leaderboard.</text></svg>